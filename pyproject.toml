[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "status-page-check"
version = "0.1.0"
description = "Analyze any company's public status page and produce an incident-communication and reliability report"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jeffery Campbell" }]
keywords = ["status-page", "incidents", "reliability", "sre", "incident-communication", "rss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/jeffcampbell/status-page-check"

[project.scripts]
statuscheck = "statuscheck.cli:main"

[tool.setuptools.packages.find]
include = ["statuscheck*"]
